name: Generate skill card pilot

on:
  workflow_dispatch:
    inputs:
      quality:
        description: Image quality (three pilot illustrations only)
        type: choice
        required: true
        default: xhigh
        options:
          - high
          - xhigh

permissions:
  contents: read

concurrency:
  group: skill-card-pilot
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out card definitions
        uses: actions/checkout@v4
        with:
          ref: skill-pages
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: python -m pip install Pillow fonttools brotli
      - name: Generate exactly three pilot illustrations and fixed-layout previews
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_QUALITY: ${{ inputs.quality }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import io
          import json
          import os
          import re
          import urllib.request
          import urllib.error
          from functools import lru_cache
          from pathlib import Path
          
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          from fontTools.ttLib import TTFont
          
          ROOT = Path("source")
          MEDIA = ROOT / "docs/media"
          OUT = Path("card-preview")
          OUT.mkdir(exist_ok=True)
          W, H = 1024, 1536
          CREAM = "#F6EFE3"
          MODEL = "gpt-image-2.5-flare"
          QUALITY = os.environ["IMAGE_QUALITY"]
          PILOT = {
              1: ("code-audit", "#0D3940", "#F7CF35",
                  "Audits a codebase for security, quality, performance, and testing risks, then ranks the fixes."),
              16: ("slop-scan", "#3F1027", "#FDBE2A",
                   "Detects common AI-generated website design patterns and helps remove them from the code."),
              28: ("who-let-the-blogs-out", "#1C1B1A", "#F66B18",
                   "Plans, researches, writes, reviews, and refreshes blog content using the author's real expertise."),
          }
          if QUALITY not in {"high", "xhigh"}:
              raise SystemExit("Unsupported quality")
          pattern = r"^## (\d+)\s+·\s+([^\n]+)\n\n\x60\x60\x60text\n(.*?)\n\x60\x60\x60"
          prompts = {}
          for number, title, prompt in re.findall(pattern, (MEDIA / "PROMPTS.md").read_text(), re.M | re.S):
              n = int(number)
              if n in prompts:
                  raise SystemExit("Duplicate prompt number")
              prompts[n] = (title.strip(), prompt.strip())
          
          if len(prompts) != 41 or not set(PILOT).issubset(prompts):
              raise SystemExit(f"Expected 41 unique prompts and the three pilot IDs; found {len(prompts)}")
          
          @lru_cache(maxsize=64)
          def font(role, size):
              files = {
                  "header": "montserrat-latin-600-normal.woff2",
                  "body": "montserrat-latin-500-normal.woff2",
                  "title": "montserrat-latin-900-italic.woff2",
              }
              f = TTFont(MEDIA / "_fonts" / files[role])
              f.flavor = None
              buf = io.BytesIO()
              f.save(buf)
              f.close()
              buf.seek(0)
              return ImageFont.truetype(buf, size)
          
          def tracked(draw, xy, text, f, fill, spacing):
              x, y = xy
              for char in text:
                  draw.text((x, y), char, font=f, fill=fill, anchor="lt")
                  x += draw.textlength(char, font=f) + spacing
          
          def wrap(draw, text, f, width):
              lines = []
              line = ""
              for word in text.split():
                  trial = (line + " " + word).strip()
                  if line and draw.textlength(trial, font=f) > width:
                      lines.append(line)
                      line = word
                  else:
                      line = trial
              if line:
                  lines.append(line)
              return lines
          
          def fit(draw, text, role, max_size, min_size, width, max_lines):
              for size in range(max_size, min_size - 1, -1):
                  f = font(role, size)
                  lines = wrap(draw, text, f, width)
                  if len(lines) <= max_lines and all(draw.textlength(l, font=f) <= width for l in lines):
                      return f, lines, size
              raise ValueError(f"Text does not fit: {text}")
          
          def render(art, n, meta, panel, accent, description):
              art = art.convert("RGB")
              card = Image.new("RGB", (W, H), CREAM)
              inner = Image.new("RGB", (W, H), panel)
              fitted = ImageOps.fit(art, (960, 1472), method=Image.Resampling.LANCZOS)
              inner.paste(fitted, (32, 32))
              d = ImageDraw.Draw(inner)
              # Only the artwork and palette change. The shell stays fixed.
              d.rectangle((32, 32, 992, 218), fill=CREAM)
              d.polygon([(830, 32), (992, 32), (992, 218), (710, 218)], fill=accent)
              d.rectangle((32, 1080, 992, 1504), fill=panel)
              tracked(d, (84, 76), "SKILL COLLECTION", font("header", 40), "#1C2227", 8)
              d.rectangle((84, 137, 158, 146), fill=accent)
              category = meta["set"].upper()
              cf = font("header", 21)
              if sum(d.textlength(c, font=cf) + 4 for c in category) > 525:
                  raise ValueError(f"Category too wide: {category}")
              tracked(d, (184, 131), category, cf, "#1C2227", 4)
              d.text((950, 73), f"{n:02d}", font=font("title", 102), fill=panel, anchor="rt")
              f, lines, size = fit(d, meta["title"].upper(), "title", 84, 56, 840, 2)
              y = 1104
              for i, line in enumerate(lines):
                  d.text((84, y), line, font=f, fill=accent if i == 1 else CREAM, anchor="lt")
                  y += size + 9
              y += 18
              bf, body, bsize = fit(d, description, "body", 34, 29, 840, 4)
              for line in body:
                  d.text((84, y), line, font=bf, fill=CREAM, anchor="lt")
                  y += bsize + 10
              if y > 1440:
                  raise ValueError("Description exceeds reserved footer")
              d.rectangle((84, 1450, 193, 1461), fill=accent)
              mask = Image.new("L", (W, H))
              ImageDraw.Draw(mask).rounded_rectangle((32, 32, 991, 1503), radius=44, fill=255)
              card.paste(inner, (0, 0), mask)
              # Preserve the outer rounded ivory card shape.
              outer = Image.new("L", (W, H))
              ImageDraw.Draw(outer).rounded_rectangle((0, 0, W-1, H-1), radius=64, fill=255)
              card = card.convert("RGBA")
              card.putalpha(outer)
              return card
          
          jobs = []
          for n, (slug, panel, accent, description) in PILOT.items():
              title, prompt = prompts[n]
              meta = json.loads((MEDIA / slug / "card.json").read_text())
              if title.lower() != meta["title"].lower():
                  raise SystemExit(f"Prompt / metadata mismatch for {slug}")
              # Free preflight: verify font loading, fit, and rendering for every card before spending.
              test = render(Image.new("RGB", (W, H), accent), n, meta, panel, accent, description)
              assert test.size == (W, H)
              jobs.append((n, slug, title, prompt, meta, panel, accent, description))
          print("Preflight passed for all three pilot cards.", flush=True)
          key = os.environ.get("OPENAI_API_KEY")
          if not key:
              raise SystemExit("Missing OPENAI_API_KEY repository secret")
          
          usage_log = []
          cards = []
          for n, slug, title, prompt, meta, panel, accent, description in jobs:
              print(f"Generating {n:02d} {title}", flush=True)
              payload = json.dumps({
                  "model": MODEL,
                  "prompt": prompt,
                  "size": "1024x1536",
                  "quality": QUALITY,
                  "output_format": "png",
                  "n": 1,
              }).encode("utf-8")
              req = urllib.request.Request(
                  "https://api.openai.com/v1/images/generations",
                  data=payload, method="POST",
                  headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=360) as resp:
                      result = json.load(resp)
              except urllib.error.HTTPError as err:
                  # Never print credentials or full request bodies. No automatic paid retry.
                  try:
                      code = json.load(err).get("error", {}).get("code")
                  except Exception:
                      code = None
                  raise SystemExit(f"Image request failed for {slug}: HTTP {err.code}, code={code}") from None
              raw = base64.b64decode(result["data"][0]["b64_json"], validate=True)
              art = Image.open(io.BytesIO(raw))
              art.load()
              if art.size != (W, H):
                  raise SystemExit(f"Unexpected image dimensions for {slug}: {art.size}")
              folder = OUT / slug
              folder.mkdir(exist_ok=True)
              (folder / "art.png").write_bytes(raw)
              card = render(art, n, meta, panel, accent, description)
              card.save(folder / "front.png")
              cards.append(card)
              usage_log.append({"number": n, "skill": slug, "model": MODEL,
                                "quality": QUALITY, "usage": result.get("usage")})
              (OUT / "usage.json").write_text(json.dumps(usage_log, indent=2))
              print(f"Saved artwork and fixed-layout preview for {slug}", flush=True)
          
          sheet = Image.new("RGB", (3*352+4*18, 528+36), "#D5D3CE")
          for i, card in enumerate(cards):
              thumb = card.resize((352, 528), Image.Resampling.LANCZOS)
              sheet.paste(thumb, (18+i*370, 18), thumb)
          sheet.save(OUT / "review.jpg", quality=95)
          (OUT / "README.txt").write_text(
              "Pilot only. Review review.jpg, then the individual front.png and art.png files.\n"
              "Inspect artwork for unwanted lettering and clipped subjects. No visual approval is assumed.\n"
              "No existing repository cards have been overwritten or published.\n"
              "usage.json records reported API usage when available.\n")
          print("Three previews saved. Human visual approval required before the full batch.")
          PY
      - name: Upload review files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: skill-card-pilot
          path: card-preview/
          if-no-files-found: warn
          retention-days: 14
