name: Generate skill card pilot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only (free) or generate three pilot illustrations
        type: choice
        required: true
        default: plan
        options:
          - plan
          - pilot
      quality:
        description: Image quality (used only for paid pilot)
        type: choice
        required: true
        default: xhigh
        options:
          - high
          - xhigh

permissions:
  contents: read

concurrency:
  group: skill-card-pilot
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out artwork prompts
        uses: actions/checkout@v4
        with:
          ref: skill-pages
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG validation dependency
        run: python -m pip install Pillow
      - name: Validate manifest or generate three standalone PNGs
        env:
          OPENAI_API_KEY: ${{ inputs.mode == 'pilot' && secrets.OPENAI_API_KEY || '' }}
          RUN_MODE: ${{ inputs.mode }}
          IMAGE_QUALITY: ${{ inputs.quality }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import io
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path
          
          from PIL import Image
          
          SOURCE = Path("source/docs/media/prompts.json")
          OUT = Path("skill-art")
          OUT.mkdir(exist_ok=True)
          PILOT = ("code-audit", "slop-scan", "who-let-the-blogs-out")
          MODEL = "gpt-image-2.5-flare"
          mode = os.environ["RUN_MODE"]
          quality = os.environ["IMAGE_QUALITY"]
          if mode not in {"plan", "pilot"} or quality not in {"high", "xhigh"}:
              raise SystemExit("Invalid run inputs")
          manifest = json.loads(SOURCE.read_text(encoding="utf-8"))
          entries = manifest["images"]
          if not isinstance(entries, list) or len(entries) != 41:
              raise SystemExit("Expected 41 artwork entries; review changes before generating.")
          by_skill = {}
          for entry in entries:
              slug = entry["skill"]
              if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", slug) or slug in by_skill:
                  raise SystemExit("Invalid or duplicate skill slug")
              if (entry["file"] != slug + ".png" or entry["size"] != "1024x1536"
                      or entry["output_format"] != "png" or not entry["prompt"].strip()):
                  raise SystemExit(f"Invalid artwork specification: {slug}")
              by_skill[slug] = entry
          selected = [by_skill[slug] for slug in PILOT]
          (OUT / "plan.json").write_text(json.dumps({
              "mode": mode, "model": MODEL, "quality": quality,
              "manifest_entries": len(entries), "images": selected,
          }, indent=2), encoding="utf-8")
          for entry in selected:
              print(f'{entry["skill"]}: {entry["file"]}, {entry["size"]}, PNG')
          if mode == "plan":
              print("Dry run: 41 entries validated, three pilot prompts selected, zero API requests.")
              raise SystemExit(0)
          
          key = os.environ.get("OPENAI_API_KEY")
          if not key:
              raise SystemExit("Missing OPENAI_API_KEY repository secret")
          
          usage = []
          for entry in selected:
              print(f'Generating {entry["skill"]}', flush=True)
              payload = json.dumps({
                  "model": MODEL,
                  "prompt": entry["prompt"],
                  "size": entry["size"],
                  "quality": quality,
                  "output_format": "png",
                  "n": 1,
              }).encode("utf-8")
              req = urllib.request.Request(
                  "https://api.openai.com/v1/images/generations",
                  data=payload, method="POST",
                  headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=360) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as err:
                  try:
                      code = json.load(err).get("error", {}).get("code")
                  except Exception:
                      code = None
                  raise SystemExit(f'Image request failed: HTTP {err.code}, code={code}') from None
              raw = base64.b64decode(result["data"][0]["b64_json"], validate=True)
              with Image.open(io.BytesIO(raw)) as image:
                  image.load()
                  if image.format != "PNG" or image.size != (1024, 1536):
                      raise SystemExit(f'Invalid image format or size: {entry["skill"]}')
              (OUT / entry["file"]).write_bytes(raw)
              usage.append({"skill": entry["skill"], "model": MODEL,
                            "quality": quality, "usage": result.get("usage")})
              (OUT / "usage.json").write_text(json.dumps(usage, indent=2), encoding="utf-8")
              print(f'Saved {entry["file"]}', flush=True)
          print("Three standalone PNG illustrations saved. Visual review still required.")
          PY
      - name: Upload artwork and generation records
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: skill-art-pilot
          path: skill-art/
          if-no-files-found: warn
          retention-days: 14
