<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="The 14 who-let-the-blogs-out commands grouped into Setup, Capture, Draft, Ship and Run, with write, revise and refresh chaining into review">
  <rect x="14" y="14" width="1172" height="532" rx="14" fill="#1D1A16"/>
  <rect x="4" y="4" width="1172" height="532" rx="14" fill="#F6F1E7" stroke="#1D1A16" stroke-width="3"/>
  <text x="36" y="56" font-family="Display700" font-size="18" fill="#C2367A" letter-spacing="3">THE COMMAND MAP</text>
  <text x="36" y="92" font-family="Body700" font-size="21" fill="#1D1A16">Run one step, or the whole chain. One command's output is the next one's input.</text>

  <!-- lanes -->
  <g font-family="Display900" font-size="24" fill="#F6F1E7" letter-spacing="1">
    <rect x="36" y="120" width="210" height="44" fill="#1D1A16"/><text x="52" y="151">SETUP</text>
    <rect x="258" y="120" width="210" height="44" fill="#1D1A16"/><text x="274" y="151">CAPTURE</text>
    <rect x="480" y="120" width="210" height="44" fill="#1D1A16"/><text x="496" y="151">DRAFT</text>
    <rect x="702" y="120" width="210" height="44" fill="#1D1A16"/><text x="718" y="151">SHIP</text>
    <rect x="924" y="120" width="220" height="44" fill="#F25A05"/><text x="940" y="151">RUN</text>
  </g>
  <g font-family="Body700" font-size="19" fill="#1D1A16" stroke="#1D1A16" stroke-width="2">
    <rect x="36" y="178" width="210" height="46" fill="#FFFDF8"/><text x="52" y="208" stroke="none">brand</text>
    <rect x="36" y="234" width="210" height="46" fill="#FFFDF8"/><text x="52" y="264" stroke="none">intake</text>
    <rect x="36" y="290" width="210" height="46" fill="#FFFDF8"/><text x="52" y="320" stroke="none">plan</text>

    <rect x="258" y="178" width="210" height="46" fill="#FFFDF8"/><text x="274" y="208" stroke="none">interview</text>
    <rect x="258" y="234" width="210" height="46" fill="#FFFDF8"/><text x="274" y="264" stroke="none">verify</text>

    <rect x="480" y="178" width="210" height="46" fill="#FFFDF8"/><text x="496" y="208" stroke="none">brief</text>
    <rect x="480" y="234" width="210" height="46" fill="#FDE3D3"/><text x="496" y="264" stroke="none">write</text>
    <rect x="480" y="290" width="210" height="46" fill="#FFFDF8"/><text x="496" y="320" stroke="none">images</text>

    <rect x="702" y="178" width="210" height="46" fill="#F25A05"/><text x="718" y="208" stroke="none" fill="#F6F1E7">review</text>
    <rect x="702" y="234" width="210" height="46" fill="#FDE3D3"/><text x="718" y="264" stroke="none">revise</text>
    <rect x="702" y="290" width="210" height="46" fill="#FFFDF8"/><text x="718" y="320" stroke="none">export</text>
    <rect x="702" y="346" width="210" height="46" fill="#FFFDF8"/><text x="718" y="376" stroke="none">publish</text>
    <rect x="702" y="402" width="210" height="46" fill="#FDE3D3"/><text x="718" y="432" stroke="none">refresh</text>

    <rect x="924" y="178" width="220" height="46" fill="#FFFDF8"/><text x="940" y="208" stroke="none">autopilot</text>
  </g>
  <g font-family="Body400" font-size="15" fill="#1D1A16">
    <text x="924" y="250">After one questionnaire, runs</text>
    <text x="924" y="270">to an export-ready draft.</text>
    <text x="924" y="290">Halts at five hard stops.</text>
    <text x="924" y="310" font-family="Body700">Never publishes.</text>
  </g>

  <line x1="36" y1="476" x2="1144" y2="476" stroke="#1D1A16" stroke-width="2"/>
  <rect x="36" y="494" width="22" height="22" fill="#FDE3D3" stroke="#1D1A16" stroke-width="2"/>
  <text x="70" y="512" font-family="Body400" font-size="17" fill="#1D1A16">write, revise and refresh chain into <tspan font-family="Body700">review</tspan> automatically: a draft never reaches the author unscored.</text>
</svg>
