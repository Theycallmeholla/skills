<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Example hot-seat session: three single questions, each with Claude's pick, ending in a decision log">
  <rect x="14" y="14" width="1172" height="732" rx="14" fill="#1D1A16"/>
  <rect x="4" y="4" width="1172" height="732" rx="14" fill="#F6F1E7" stroke="#1D1A16" stroke-width="3"/>
  <text x="36" y="52" font-family="Display700" font-size="18" fill="#6B4FD8" letter-spacing="3">A HOT-SEAT SESSION · FICTIONAL EXAMPLE</text>

  <!-- user opener -->
  <rect x="300" y="72" width="420" height="78" rx="12" fill="#1D1A16"/>
  <g font-family="Body400" font-size="17" fill="#F6F1E7">
    <text x="320" y="102">Hot seat me. Adding order cancellation:</text>
    <text x="320" y="128">cancel button, refund through Stripe, done.</text>
  </g>

  <!-- side note: facts looked up -->
  <g transform="rotate(-2 140 130)">
    <rect x="36" y="84" width="230" height="74" fill="#FFF4C2" stroke="#1D1A16" stroke-width="2"/>
    <text x="50" y="108" font-family="Display700" font-size="14" fill="#1D1A16" letter-spacing="2">LOOKED UP, NOT ASKED</text>
    <text x="50" y="130" font-family="Body400" font-size="14" fill="#1D1A16">Framework, payment provider:</text>
    <text x="50" y="148" font-family="Body400" font-size="14" fill="#1D1A16">read from package.json</text>
  </g>

  <!-- Q1 -->
  <g font-family="Display900" font-size="20" fill="#6B4FD8"><text x="36" y="196">Q1</text></g>
  <rect x="80" y="172" width="640" height="88" rx="12" fill="#FFFDF8" stroke="#1D1A16" stroke-width="2.5"/>
  <text x="100" y="202" font-family="Body700" font-size="17" fill="#1D1A16">Cancelled orders: keep the invoice or void it?</text>
  <text x="100" y="232" font-family="Body400" font-size="16" fill="#1D1A16"><tspan font-family="Body700" fill="#6B4FD8">My pick:</tspan> keep it. Voiding breaks the audit trail</text>
  <text x="100" y="252" font-family="Body400" font-size="16" fill="#1D1A16">you said you need.</text>
  <rect x="620" y="272" width="100" height="36" rx="10" fill="#1D1A16"/>
  <text x="670" y="296" text-anchor="middle" font-family="Body400" font-size="16" fill="#F6F1E7">Keep it.</text>

  <!-- Q2 -->
  <g font-family="Display900" font-size="20" fill="#6B4FD8"><text x="36" y="350">Q2</text></g>
  <rect x="80" y="326" width="640" height="88" rx="12" fill="#FFFDF8" stroke="#1D1A16" stroke-width="2.5"/>
  <text x="100" y="356" font-family="Body700" font-size="17" fill="#1D1A16">A refund fails. Retry on its own, or flag a human?</text>
  <text x="100" y="386" font-family="Body400" font-size="16" fill="#1D1A16"><tspan font-family="Body700" fill="#6B4FD8">My pick:</tspan> 3 tries with backoff, then flag it.</text>
  <text x="100" y="406" font-family="Body400" font-size="16" fill="#1D1A16">No strong driver either way, so it's your call.</text>
  <rect x="560" y="426" width="160" height="36" rx="10" fill="#1D1A16"/>
  <text x="640" y="450" text-anchor="middle" font-family="Body400" font-size="16" fill="#F6F1E7">Sure, 3 tries.</text>

  <!-- Q3 -->
  <g font-family="Display900" font-size="20" fill="#6B4FD8"><text x="36" y="504">Q3</text></g>
  <rect x="80" y="480" width="640" height="88" rx="12" fill="#FFFDF8" stroke="#1D1A16" stroke-width="2.5"/>
  <text x="100" y="510" font-family="Body700" font-size="17" fill="#1D1A16">Retries need a queue. The Redis you run, or SQS?</text>
  <text x="100" y="540" font-family="Body400" font-size="16" fill="#1D1A16"><tspan font-family="Body700" fill="#6B4FD8">My pick:</tspan> Redis. It's already deployed, and your</text>
  <text x="100" y="560" font-family="Body400" font-size="16" fill="#1D1A16">scale doesn't justify a migration.</text>
  <rect x="630" y="580" width="90" height="36" rx="10" fill="#1D1A16"/>
  <text x="675" y="604" text-anchor="middle" font-family="Body400" font-size="16" fill="#F6F1E7">Redis.</text>

  <!-- done test -->
  <rect x="80" y="640" width="640" height="56" rx="12" fill="#FFFDF8" stroke="#1D1A16" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="100" y="674" font-family="Body700" font-size="17" fill="#1D1A16">Here's the decision log. Is this the shared picture?</text>

  <!-- decision log panel -->
  <rect x="770" y="172" width="374" height="524" fill="#E9E3FB" stroke="#1D1A16" stroke-width="3"/>
  <rect x="770" y="172" width="374" height="58" fill="#6B4FD8" stroke="#1D1A16" stroke-width="3"/>
  <text x="792" y="211" font-family="Display900" font-size="28" fill="#F6F1E7" letter-spacing="1">THE ARTIFACT</text>
  <text x="792" y="266" font-family="Display700" font-size="16" fill="#1D1A16" letter-spacing="2">## DECISIONS</text>
  <g font-family="Body400" font-size="16" fill="#1D1A16">
    <text x="792" y="306" font-family="Body700">Invoices on cancel</text>
    <text x="792" y="328">kept, not voided: audit trail</text>
    <text x="792" y="370" font-family="Body700">Retry policy</text>
    <text x="792" y="392">3 attempts, exp backoff:</text>
    <text x="792" y="414">their call, no strong driver</text>
    <text x="792" y="456" font-family="Body700">Queue tech</text>
    <text x="792" y="478">existing Redis, not SQS: already</text>
    <text x="792" y="500">deployed; scale doesn't justify</text>
    <text x="792" y="522">a migration</text>
  </g>
  <line x1="792" y1="552" x2="1122" y2="552" stroke="#1D1A16" stroke-opacity=".3"/>
  <g font-family="Body400" font-size="15" fill="#1D1A16">
    <text x="792" y="582">Consumed by whiteboard and</text>
    <text x="792" y="604">connotation-cop. Hard-to-reverse</text>
    <text x="792" y="626">lines can become an ADR.</text>
  </g>
</svg>
