    <text x="58" y="224" font-size="30">←</text><text x="58" y="244" font-size="14" letter-spacing="1">NO</text>
    <text x="210" y="53" font-size="30">↑</text><text x="210" y="73" font-size="11" letter-spacing="1">ABSOLUTELY</text>
    <text x="210" y="383" font-size="30">↓</text><text x="210" y="403" font-size="12" letter-spacing="1">NOT SURE</text>
  </g>
  <!-- signal meter -->
  <text x="36" y="432" font-family="Display700" font-size="17" fill="#1D1A16" letter-spacing="2">SIGNAL METER</text>
  <rect x="160" y="417" width="200" height="20" fill="#FFFDF8" stroke="#1D1A16" stroke-width="2.5"/>
  <rect x="160" y="417" width="178" height="20" fill="#6B4FD8"/>
  <text x="372" y="434" font-family="Display900" font-size="20" fill="#1D1A16">89%</text>
