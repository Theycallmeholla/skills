<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 468">
  <g stroke="#1D1A16" stroke-width="3">
    <rect x="110" y="96" width="200" height="250" rx="16" fill="#C9BEF2" transform="rotate(-12 210 221)"/>
    <rect x="110" y="96" width="200" height="250" rx="16" fill="#9C87EA" transform="rotate(7 210 221)"/>
    <rect x="110" y="96" width="200" height="250" rx="16" fill="#232120"/>
  </g>
  <text x="130" y="140" font-family="Display700" font-size="15" fill="#A29B92" letter-spacing="2">WHERE IT LIVES</text>
  <text x="130" y="186" font-family="Body700" font-size="23" fill="#F5F2EE">Just a link you</text>
  <text x="130" y="214" font-family="Body700" font-size="23" fill="#F5F2EE">paste into an</text>
  <text x="130" y="242" font-family="Body700" font-size="23" fill="#F5F2EE">email</text>
  <!-- direction arrows, colours from the real deck widget -->
  <g stroke="#1D1A16" stroke-width="3">
    <circle cx="362" cy="221" r="36" fill="#3FB950"/><circle cx="58" cy="221" r="36" fill="#F0603D"/>
    <circle cx="210" cy="50" r="36" fill="#58A6FF"/><circle cx="210" cy="380" r="36" fill="#E3B341"/>
  </g>
  <g font-family="Display900" fill="#1D1A16" text-anchor="middle">
